name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: python3 scripts/check_release.py --channel preview
      - run: flutter build web --release --web-renderer canvaskit --no-web-resources-cdn --pwa-strategy=none --dart-define=LUNAR_MODEL_BASE_URL=https://fatepair-api-buaa42wxys-projects.vercel.app/api/model
      - uses: actions/upload-artifact@v4
        with:
          name: fatepair-web
          path: build/web
          retention-days: 7
  chart-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: python scripts/audit_dependencies.py --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --dart-define=LUNAR_MODEL_BASE_URL=https://fatepair-api-buaa42wxys-projects.vercel.app/api/model
      - uses: actions/upload-artifact@v4
        with:
          name: fatepair-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --no-codesign --dart-define=LUNAR_MODEL_BASE_URL=https://fatepair-api-buaa42wxys-projects.vercel.app/api/model
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app fatepair-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fatepair-ios-simulator
          path: fatepair-ios-simulator.zip
          retention-days: 7
