plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file("key.properties")
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    namespace = "com.lunar.lunar_social"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.lunar.lunar_social"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releasePropertiesFile.exists()) {
            release {
                keyAlias = releaseProperties["keyAlias"]
                keyPassword = releaseProperties["keyPassword"]
                storeFile = file(releaseProperties["storeFile"])
                storePassword = releaseProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Missing release credentials produce an unsigned artifact.
            // Never silently ship an artifact signed with a development key.
            signingConfig = releasePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}
