<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find your kind of energy. Meaningful connections, inspired by BaZi and the Five Elements.">
  <meta name="theme-color" content="#F3F5EE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lunar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Lunar — Find your kind of energy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #FAFBF8; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; font: 15px system-ui, sans-serif; color: #416B54; }
    #loading img { width: 56px; height: 56px; margin: 0 auto 18px; animation: breathe 2s ease-in-out infinite; }
    #loading strong { font-size: 30px; letter-spacing: -1px; font-weight: 500; }
    #loading p { color: #7A817A; font-size: 12px; margin-top: 12px; }
    @keyframes breathe { 50% { opacity: .55; transform: scale(.92); } }
    @media (prefers-reduced-motion: reduce) { #loading img { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status"><img src="favicon.svg" alt=""><strong>lunar</strong><p>A little fate. A real connection.</p></div>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
